name: reproducible-research
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lab-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validation:
    name: validation (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.11']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install locked dependencies and complete package
        run: |
          python -m pip install -r requirements-lock.txt
          python -m pip install .
          python -m pip check
      - name: Compile and run all behavioral tests
        run: |
          python -m compileall -q risklab scripts
          python -W error -m unittest discover -s tests -v
      - name: Legacy and research integration smoke
        run: |
          python -W error -m risklab demo --out runs/ci
          python -W error -m risklab research-demo --out runs/research
          python scripts/verify_rc1.py runs/research/normal
          python scripts/verify_artifacts.py
      - name: Real field tools, label study and saved inference
        run: |
          python -m risklab label-study --data runs/research/normal --out runs/visibility
          python -m risklab field-workflow --data runs/research/normal --out runs/field-tools
          python -m risklab predict --model runs/research/normal/models/raw_forest.json --data runs/research/normal/samples.csv --out runs/inference
          python -c "import json; r=json.load(open('runs/field-tools/evaluation.json')); assert r['status']=='PASS' and not r['llm_used']"
      - name: Candidate, complete reachable history and license assets
        run: |
          python scripts/prepare_release.py --out runs/public-candidate
          python scripts/audit_release.py --root runs/public-candidate > runs/candidate-audit.json
          python scripts/audit_release.py > runs/history-audit.json
          python -c "import json; assert all(json.load(open(p))['release_ready'] for p in ['runs/candidate-audit.json','runs/history-audit.json'])"
          test -s LICENSE
          test -s docs/third-party-licenses.txt
      - name: Build and scan static demo
        run: |
          python scripts/build_pages.py --out _site
          python scripts/audit_release.py --root _site > runs/site-audit.json
          python -c "import json; assert json.load(open('runs/site-audit.json'))['release_ready']"
  pages-build:
    if: vars.LAB_PAGES_ENABLED == 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: validation
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - run: python3 scripts/build_pages.py --out _site
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site
          retention-days: 1
  pages-deploy:
    if: vars.LAB_PAGES_ENABLED == 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: pages-build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
