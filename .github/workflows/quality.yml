name: Quality evidence
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: false
jobs:
  measurement:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install fixed runtime and separate verification tools
        run: python -m pip install -r requirements-lock.txt -r requirements-quality.txt
      - name: Execute all tests with complete package coverage
        run: |
          mkdir -p runs/quality
          python -W error -m coverage run -m unittest discover -s tests -v
          python -m coverage json
          python -m coverage xml
          python -m coverage html
          python -m coverage report
      - name: Scan all Python application and delivery sources
        run: |
          python -m bandit -r risklab scripts -f json -o runs/quality/bandit.json --exit-zero
          python scripts/quality_evidence.py --commit "$GITHUB_SHA"
      - name: Preserve complete reports even when validation fails
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: quality-evidence
          path: runs/quality
          if-no-files-found: error
          retention-days: 7
  codecov:
    if: github.ref == 'refs/heads/main' && vars.CODECOV_ENABLED == 'true'
    needs: measurement
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: quality-evidence
          path: runs/quality
      - name: Authenticated coverage upload without a personal token
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: runs/quality/coverage.xml
          disable_search: true
          fail_ci_if_error: true
  sonar:
    if: github.ref == 'refs/heads/main' && vars.SONAR_ENABLED == 'true'
    needs: measurement
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: quality-evidence
          path: runs/quality
      - name: Check actual account configuration
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
        run: test -n "$SONAR_TOKEN" && test -n "$SONAR_ORGANIZATION" && test -n "$SONAR_PROJECT_KEY"
      - uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >-
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
      - name: Require the actual Sonar quality gate result
        uses: SonarSource/sonarqube-quality-gate-action@7a5fffe8e523c40e0c740b6bc2712ab503e52efa # v1.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  provenance:
    if: github.ref == 'refs/heads/main'
    needs: measurement
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Build the actual wheel from the public allowlist
        run: |
          python -m pip install setuptools==80.9.0 wheel==0.45.1
          python scripts/prepare_release.py --out runs/public-candidate
          python scripts/audit_release.py --root runs/public-candidate > runs/candidate-audit.json
          python -c "import json; assert json.load(open('runs/candidate-audit.json'))['release_ready']"
          python -m pip wheel --no-deps --no-build-isolation runs/public-candidate -w dist
          sha256sum dist/*.whl > dist/SHA256SUMS
      - name: Sign build provenance using short-lived GitHub identity
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*.whl
          create-storage-record: false
      - name: Verify signed provenance and exact source commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh attestation verify dist/*.whl --repo "$GITHUB_REPOSITORY" --source-digest "$GITHUB_SHA" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/quality.yml" --deny-self-hosted-runners --format json > dist/verification.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: attested-wheel
          path: dist
          if-no-files-found: error
          retention-days: 7
